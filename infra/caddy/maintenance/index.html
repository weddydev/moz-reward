<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Moz Rewards — coming soon</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2;
        --fg: #1d1b18;
        --muted: #6b655c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151412;
          --fg: #f3efe8;
          --muted: #a8a196;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        display: grid;
        place-items: center;
        padding: 0 16px;
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Moz Rewards is coming soon</h1>
      <p>We're getting everything ready. Please check back shortly.</p>
    </main>
  </body>
</html>
