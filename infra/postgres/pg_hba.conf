# Staging/production client authentication (P0-15, SECURITY §11). First match wins.
# The superuser exists only for the bootstrap, dumps and restores: Unix socket, as the OS user postgres
# (`docker exec -u postgres`). Never over the network.
# TYPE  DATABASE  USER                                      ADDRESS     METHOD
local   all       postgres                                              peer
local   all       all                                                   reject
host    all       postgres                                  0.0.0.0/0   reject
host    all       postgres                                  ::/0        reject
# The app database: the migration owner and the three RLS login roles (ARCHITECTURE §9).
host    moz       moz_owner,moz_app,moz_auth,moz_worker     samenet     scram-sha-256
# Umami's own database and role (production only); no access to the app database.
host    umami     umami                                     samenet     scram-sha-256
host    all       all                                       0.0.0.0/0   reject
host    all       all                                       ::/0        reject
