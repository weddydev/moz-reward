# Staging override (P0-15): limits from infra/RESOURCES.md (staging total ≈ 3.3 GB, cpus 1.5 in total) so it
# can never starve production. memswap_limit = mem_limit: staging containers never swap (AC7).
# Change this file and RESOURCES.md together (infra/compose.test.ts compares them).

services:
  # Until launch, Cloudflare's proxy reaches staging directly (T-5, DECISIONS 14 Nov): Caddy publishes 443 on IPv4
  # TCP only. The host firewall (moz-origin-firewall, DOCKER-USER) admits only Cloudflare's ranges to the ingress
  # bridge, and Caddy requires Cloudflare's origin-pull client certificate. The only `ports:` in the stacks.
  caddy:
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.05
    ports:
      - "0.0.0.0:443:443/tcp"
    networks: [ingress, app]
    volumes:
      - ${MOZ_INFRA:?}/caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - ${MOZ_INFRA:?}/caddy/cloudflare-origin-pull-ca.pem:/etc/caddy/cloudflare-origin-pull-ca.pem:ro
      # Cloudflare Origin CA certificate + key (`moz-deploy write-env staging origin-tls`; key 0640 root:1000).
      - ${MOZ_ETC:?}/caddy-tls:/etc/caddy/tls:ro

  web-1:
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.4
    environment: &web-env
      NODE_OPTIONS: --max-old-space-size=384
  web-2:
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.4
    environment: *web-env

  worker:
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.25
    environment:
      NODE_OPTIONS: --max-old-space-size=576

  postgres:
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.25
    shm_size: 128m
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - listen_addresses=*
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=none
      # WAL archiving to B2 through the wrapper (P0-15 D2): a forced segment switch every minute when anything was
      # written (the health monitor writes every minute), so the newest archived WAL is at most ~1 min old.
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - archive_command=/usr/local/bin/moz-walg wal-push %p
      - -c
      - max_connections=80
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB

  redis-queue:
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.05
    command: ["redis-server", "/etc/redis/redis.conf", "--maxmemory", "192mb"]

  redis-cache:
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.05
    command: ["redis-server", "/etc/redis/redis.conf", "--maxmemory", "128mb"]

networks:
  # Cloudflare → Caddy. A fixed bridge name, so moz-origin-firewall can match it in DOCKER-USER; no masquerade,
  # so Caddy has no way out to the internet through it.
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: moz-stg-in
      com.docker.network.bridge.enable_ip_masquerade: "false"
