# Moz Rewards SSH policy (installed by infra/host/harden.sh; P0-15, SECURITY §11).
# Named 00- so it is read first: sshd keeps the FIRST value it sees, so cloud-init's 50-cloud-init.conf
# (`PasswordAuthentication yes`) can't turn passwords back on. harden.sh appends the AllowUsers line.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitRootLogin no
MaxAuthTries 3
MaxSessions 4
MaxStartups 10:30:60
LoginGraceTime 30
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
