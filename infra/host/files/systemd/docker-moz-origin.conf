# docker.service drop-in (P0-15 C1b), installed by harden.sh as
# /etc/systemd/system/docker.service.d/moz-origin.conf: load the staging origin lock before dockerd forwards
# anything, and check it once Docker has created its own chains (FORWARD → DOCKER-USER). The `-` keeps a failure
# from stopping Docker (and so the production stack); `apply` fails closed for staging instead, and the daily
# refresh alerts (host:origin-firewall-failed).
[Service]
ExecStartPre=-/usr/local/sbin/moz-origin-firewall apply
ExecStartPost=-/usr/local/sbin/moz-origin-firewall check
