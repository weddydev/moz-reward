# Local development and test services (P0-02, TESTING §9). Staging/production compose files live next to this one.
# Start: pnpm services:up (Docker pre-flight, then `docker compose -f infra/docker-compose.dev.yml up -d --wait`)
# Stop: pnpm services:down   ·   Wipe data: docker compose -f infra/docker-compose.dev.yml down -v
# Ports bind to 127.0.0.1 only. Port conflicts: see README "Local setup".
# Postgres 17 (not 16): see DECISIONS "Local Postgres 17".
name: moz-rewards

services:
  postgres:
    # Multi-arch (amd64 + arm64) build of the official PostGIS image; postgis/postgis is amd64-only.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: moz
      POSTGRES_PASSWORD: moz
      POSTGRES_DB: moz
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./local/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      # Over TCP: during first-start init the image runs a temporary server on the Unix socket only, then
      # restarts it. A socket check passes during init and the first TCP client gets ECONNRESET (seen in CI).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U moz -d moz"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "moz", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "moz", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Local/test SMTP catcher with web UI (http://localhost:8025) and API used by tests.
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # Local/test S3-compatible storage (production uses Cloudflare R2 through the same S3 API).
    # MinIO no longer publishes maintained community images; Chainguard's build is pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: moz
      MINIO_ROOT_PASSWORD: moz-minio-local
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # Healthy only once the app bucket exists: creates it on first start (idempotent), so `up --wait` leaves
      # MinIO ready for `pnpm dev` and the tests. Uses the mc binary shipped in the image.
      test:
        - CMD-SHELL
        - >-
          MC_CONFIG_DIR=/tmp/.mc MC_HOST_local=http://moz:moz-minio-local@127.0.0.1:9000
          mc mb --ignore-existing local/moz-rewards >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  redisdata:
  miniodata:
