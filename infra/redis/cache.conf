# redis-cache (staging/production; ARCHITECTURE §12, P0-18): data cache + pub/sub only. Evicts least-recently-
# used keys when full and keeps nothing on disk, so filling it can never touch queue or limiter keys.
# maxmemory comes from the compose file (infra/RESOURCES.md). TLS + ACL users exactly as redis-queue.
port 0
tls-port 6379
tls-cert-file /tls/server.crt
tls-key-file /tls/server.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
aclfile /acl/users.acl
protected-mode yes
save ""
appendonly no
maxmemory-policy allkeys-lru
dir /data
