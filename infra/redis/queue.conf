# redis-queue (staging/production; ARCHITECTURE §6, §9, SECURITY §11): BullMQ, rate limits, the email counter.
# Nothing here may be evicted: AOF every second, noeviction (a full instance refuses writes instead).
# maxmemory comes from the compose file (infra/RESOURCES.md). TLS only (no plaintext port); every client is an
# ACL user with a password; `default` is disabled. Certificates and the ACL file are generated on the host by
# `moz-deploy init-env` (root-only, mounted read-only).
port 0
tls-port 6379
tls-cert-file /tls/server.crt
tls-key-file /tls/server.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
aclfile /acl/users.acl
protected-mode yes
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
dir /data
