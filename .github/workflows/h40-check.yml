# Temporary (15 Nov 2026): reads the VPS SSH host key fingerprints from GitHub's network, to compare with the Mac's reading. Never merged.
name: VPS host key check
on:
  push:
    branches: [wip/h40-check]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Host key fingerprints of 72.61.17.208
        run: |
          for t in ed25519 ecdsa rsa; do ssh-keyscan -T 10 -t "$t" 72.61.17.208 2>/dev/null | ssh-keygen -lf - || echo "$t: none"; done
