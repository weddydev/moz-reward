# Temporary (15 Nov 2026, H-42): asks Backblaze what each backup key may do. Read-only: no upload, no delete,
# no key values or tokens printed. Never merged.
name: H-42 B2 key check
on:
  push:
    branches: [wip/h40-check]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Key capabilities, prefix, bucket lock and lifecycle
        env:
          ID_STAGING: ${{ secrets.B2_BACKUP_KEY_ID_STAGING }}
          KEY_STAGING: ${{ secrets.B2_BACKUP_KEY_STAGING }}
          ID_PRODUCTION: ${{ secrets.B2_BACKUP_KEY_ID_PRODUCTION }}
          KEY_PRODUCTION: ${{ secrets.B2_BACKUP_KEY_PRODUCTION }}
        run: |
          set -u +e
          for env in STAGING PRODUCTION; do
            id_var="ID_$env"; key_var="KEY_$env"; id="${!id_var}"; key="${!key_var}"
            echo "=== $env: keyID length=${#id} key length=${#key} whitespace_in_values=$(printf '%s%s' "$id" "$key" | tr -cd ' \t\r\n' | wc -c)"
            auth=$(curl -sS --max-time 20 -u "$id:$key" https://api.backblazeb2.com/b2api/v3/b2_authorize_account)
            tok=$(jq -r '.authorizationToken // empty' <<<"$auth"); [ -n "$tok" ] && echo "::add-mask::$tok"
            if [ -z "$tok" ]; then echo "authorize FAILED: $(jq -c '{status,code,message}' <<<"$auth")"; continue; fi
            echo "authorize: ok"
            jq -c '{expires: .applicationKeyExpirationTimestamp} + (.apiInfo.storageApi | {bucketName, namePrefix, capabilities: ((.capabilities // [])|sort)})' <<<"$auth" || true
            api=$(jq -r '.apiInfo.storageApi.apiUrl' <<<"$auth"); acct=$(jq -r '.accountId' <<<"$auth"); bid=$(jq -r '.apiInfo.storageApi.bucketId // empty' <<<"$auth" || true)
            lb=$(curl -sS --max-time 20 -H "Authorization: $tok" -d "{\"accountId\":\"$acct\",\"bucketId\":\"$bid\"}" "$api/b2api/v3/b2_list_buckets")
            jq -c 'if .buckets then .buckets[] | {bucket: .bucketName, objectLock: .fileLockConfiguration, lifecycleRules} else {list_buckets: {status,code,message}} end' <<<"$lb" || true
          done
