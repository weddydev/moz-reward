# Pre-commit (P0-01): format and lint only what is staged, then scan staged changes for secrets.
# Installed by `pnpm install` (the "prepare" script). Skip once in an emergency with LEFTHOOK=0 git commit …
pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{ts,tsx,mts,mjs,js,json,css,md,yml,yaml}"
      exclude:
        - "pnpm-lock.yaml"
        - "docs/**"
        - "progress/**"
        - ".claude/skills/**"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,mts,mjs}"
      run: pnpm exec eslint --max-warnings=0 {staged_files}
    secrets:
      run: pnpm exec tsx scripts/gitleaks-staged.ts

# Pre-push (P0-14): refuses force-pushes and deleting main; runs `pnpm gate:task` unless the push is
# docs/progress-only (scripts/pre-push.ts). In GITHUB_MODE=free this hook is the only push guard.
pre-push:
  # A script, not a command: lefthook skips pre-push *commands* when `git diff HEAD @{push}` is empty (every new
  # branch, `git push origin :main`), even with a custom `files`. Scripts always run; the script reads git's stdin.
  scripts:
    "guard-and-gate.sh":
      runner: sh
      use_stdin: true
