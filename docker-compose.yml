# Local development services only (staging/prod compose files live in infra/).
# Start: docker compose up -d   ·   Stop: docker compose down   ·   Wipe data: docker compose down -v
name: moz-rewards

services:
  postgres:
    # Multi-arch (amd64 + arm64) build of the official PostGIS image; postgis/postgis is amd64-only.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: moz
      POSTGRES_PASSWORD: moz
      POSTGRES_DB: moz
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moz -d moz"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "moz", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "moz", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Local/test SMTP catcher with web UI (http://localhost:8025) and API used by tests.
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # Local/test S3-compatible storage (production uses Cloudflare R2 through the same S3 API).
    # MinIO no longer publishes maintained community images; Chainguard's build is pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: moz
      MINIO_ROOT_PASSWORD: moz-minio-local
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
