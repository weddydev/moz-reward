allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: false
  "@prisma/client": false
  better-sqlite3: false
  lefthook: false # hooks are installed by the "prepare" script instead
  msgpackr-extract: false # optional native speed-up for BullMQ's msgpackr; the pure-JS path is used

# Supply chain (ENGINEERING §14): never resolve a version published less than 3 days ago (minutes).
# 3 days is the project standard (ENGINEERING §14); Semgrep's rule suggests 7. DECISIONS 2026-11-09.
# nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
minimumReleaseAge: 4320
